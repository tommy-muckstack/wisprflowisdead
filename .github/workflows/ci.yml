name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Assemble app bundle
        run: NO_OPEN=1 scripts/run-dev.sh

  linux-core:
    # FlowCore is pure Foundation, so its tests also run on Linux.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"
      - run: swift test
